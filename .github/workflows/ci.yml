name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build sandbox image
        run: docker build -t prguard-sandbox:node20 sandbox
      - name: Lint
        run: ruff check app tests
      - name: Test with coverage gate (90%)
        run: pytest --cov=app --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # Placeholders are filled in as the dashboard, demo repo and Playwright suite land.
  dashboard:
    name: Dashboard (placeholder)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Enabled in Phase 8"
