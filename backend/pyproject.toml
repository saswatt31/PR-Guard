[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prguard-backend"
version = "0.1.0"
description = "PR-Guard webhook service, agent graph and Docker sandbox"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6,<7",
  "langgraph>=0.2,<2",
  "docker>=7,<8",
  "requests>=2.31,<3",
  "tree-sitter>=0.23,<0.27",
  "tree-sitter-typescript>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "docker: requires a working Docker daemon",
  "integration: exercises multiple layers together",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/__init__.py",
  "app/agents/__init__.py",
  "app/api/__init__.py",
  "app/github/__init__.py",
  "app/sandbox/__init__.py",
  "app/webhooks/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
